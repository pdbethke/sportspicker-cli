[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sportspicker-cli"
version = "0.3.0"
description = "A command line over the pick'em scoring arithmetic. No database, no server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Elastic-2.0" }

# One dependency, and it has none of its own. That is the whole point: this
# runs anywhere the library does, including inside an offline sandbox that
# mounts the system but not your home directory. A nicer argument parser would
# cost that, so the CLI is argparse.
#
# sportspicker-core is not published to PyPI, so it is pinned to a release
# tag's archive on GitHub. A bare "sportspicker-core" would be satisfied by
# whatever someone else published under that name. The tag must exist for an
# install to work.
dependencies = [
    "sportspicker-core @ https://github.com/pdbethke/sportspicker-core/archive/refs/tags/v0.3.0.tar.gz",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
# Not "sportspicker": the application installs a command by that name, and
# two packages providing one script overwrite each other.
sportspicker-calc = "sportspicker_cli.main:main"

[tool.setuptools.packages.find]
include = ["sportspicker_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
