# SPDX-License-Identifier: Elastic-2.0
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The scoring library is the only dependency and is not on PyPI yet, so
      # take it from source. In-project venv on purpose: the audit gate's
      # sandbox binds /usr but not $HOME, so a runner-level install would be
      # invisible inside it.
      - name: Check out sportspicker-core beside us
        uses: actions/checkout@v4
        with:
          repository: pdbethke/sportspicker-core
          path: .core

      - name: Install into an in-project venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet ./.core pytest

      - name: Run the suite
        run: .venv/bin/python -m pytest tests -q
